<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rastreador Solar</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<script src="/app.js"></script>

<div class="max-w">
  <div class="hero">
    <h1>Rastreador Solar — ESP32</h1>
    <p class="sub">Performance em Sistemas Ciberfísicos · PUCPR 2026</p>
    <div class="status-chip"><div class="s-dot" id="dot"></div><span id="stxt">Conectando...</span></div>

    <div class="sleep-banner" id="sleep-banner"><span id="sleep-msg"></span></div>

    <div style="display:flex;justify-content:center">
      <div class="solar-stage">

        <div class="ldr-card ldr-tl" id="card-tl">
          <div class="lc-icon">🔆</div>
          <div class="lc-lbl">Sup. Esq.</div>
          <div class="lc-val" id="v-tl">--</div>
        </div>

        <div class="ldr-card ldr-tr" id="card-tr">
          <div class="lc-icon">🔆</div>
          <div class="lc-lbl">Sup. Dir.</div>
          <div class="lc-val" id="v-tr">--</div>
        </div>

        <svg class="painel-svg" id="painel-svg" viewBox="0 0 280 210" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#1a3a6e"/>
              <stop offset="100%" style="stop-color:#0d1f38"/>
            </linearGradient>
            <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#1e4080;stop-opacity:.85"/>
              <stop offset="100%" style="stop-color:#0f2857;stop-opacity:.85"/>
            </linearGradient>
            <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            <radialGradient id="sunspot" cx="50%" cy="50%" r="50%">
              <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:.18"/>
              <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0"/>
            </radialGradient>
          </defs>
          <rect x="4" y="4" width="272" height="202" rx="10" fill="#0a1628" stroke="#2a4a8a" stroke-width="2.5"/>
          <rect x="10" y="10" width="260" height="190" rx="7" fill="url(#pg)" stroke="#1d3a70" stroke-width="1"/>
          <g fill="url(#cg)" stroke="#2a5090" stroke-width=".6">
            <rect x="14" y="14" width="58" height="42" rx="3"/><rect x="78" y="14" width="58" height="42" rx="3"/><rect x="142" y="14" width="58" height="42" rx="3"/><rect x="206" y="14" width="60" height="42" rx="3"/>
            <rect x="14" y="62" width="58" height="42" rx="3"/><rect x="78" y="62" width="58" height="42" rx="3"/><rect x="142" y="62" width="58" height="42" rx="3"/><rect x="206" y="62" width="60" height="42" rx="3"/>
            <rect x="14" y="110" width="58" height="42" rx="3"/><rect x="78" y="110" width="58" height="42" rx="3"/><rect x="142" y="110" width="58" height="42" rx="3"/><rect x="206" y="110" width="60" height="42" rx="3"/>
            <rect x="14" y="158" width="58" height="38" rx="3"/><rect x="78" y="158" width="58" height="38" rx="3"/><rect x="142" y="158" width="58" height="38" rx="3"/><rect x="206" y="158" width="60" height="38" rx="3"/>
          </g>
          <g stroke="#3a6ab0" stroke-width=".8" opacity=".5">
            <line x1="72" y1="14" x2="72" y2="196"/><line x1="136" y1="14" x2="136" y2="196"/><line x1="200" y1="14" x2="200" y2="196"/>
            <line x1="14" y1="58" x2="266" y2="58"/><line x1="14" y1="106" x2="266" y2="106"/><line x1="14" y1="154" x2="266" y2="154"/>
          </g>
          <rect x="10" y="10" width="260" height="70" rx="7" fill="white" opacity=".04"/>
          <rect x="4" y="4" width="272" height="202" rx="10" fill="none" stroke="#4a7acc" stroke-width="1.5" opacity=".5" filter="url(#glow)"/>
          <circle cx="140" cy="105" r="22" fill="none" stroke="#ffa657" stroke-width="1.5" stroke-dasharray="5,4" opacity=".7"/>
          <circle cx="140" cy="105" r="5" fill="#ffa657" opacity=".9"/>
          <text x="140" y="138" text-anchor="middle" font-size="11" fill="#ffa657" font-family="Inter,sans-serif" id="svg-ang">90°</text>
          <ellipse id="sunspot-el" cx="140" cy="105" rx="80" ry="60" fill="url(#sunspot)" opacity="0"/>
        </svg>

        <div class="ldr-card ldr-bl" id="card-bl">
          <div class="lc-icon">🔆</div>
          <div class="lc-lbl">Inf. Esq.</div>
          <div class="lc-val" id="v-bl">--</div>
        </div>

        <div class="ldr-card ldr-br" id="card-br">
          <div class="lc-icon">🔆</div>
          <div class="lc-lbl">Inf. Dir.</div>
          <div class="lc-val" id="v-br">--</div>
        </div>

      </div>
    </div>
  </div>

  <div class="bottom-grid">
    <div class="b-card temp">
      <div class="bc-icon">🌡️</div>
      <div class="bc-lbl">Temperatura</div>
      <div class="bc-val" id="temp">--</div>
      <div class="bc-unit">°C</div>
    </div>
    <div class="b-card umid">
      <div class="bc-icon">💧</div>
      <div class="bc-lbl">Umidade</div>
      <div class="bc-val" id="umid">--</div>
      <div class="bc-unit">%</div>
    </div>
    <div class="b-card servo">
      <div class="bc-icon">↕️</div>
      <div class="bc-lbl">Servo Vertical</div>
      <div class="bc-val" id="sv">--</div>
      <div class="bc-unit">graus</div>
      <div class="srv-bar-bg"><div class="srv-bar-fill" id="sv-bar" style="width:50%"></div></div>
    </div>
    <div class="b-card servo">
      <div class="bc-icon">↔️</div>
      <div class="bc-lbl">Servo Horizontal (360° contínuo)</div>
      <div class="bc-val" id="sh">--</div>
      <div class="bc-unit">graus</div>
      <div class="srv-bar-bg"><div class="srv-bar-fill" id="sh-bar" style="width:50%"></div></div>
      <div id="sh-estado" style="margin-top:6px;font-size:0.72rem;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:#94a3b8;">--</div>
    </div>
  </div>

  <!-- Botão toggle de rastreamento -->
  <div style="display:flex;justify-content:center;margin:18px 0 4px;">
    <button id="btn-rastr" onclick="toggleRastreamento()"
      style="display:flex;align-items:center;gap:10px;padding:10px 28px;
             border-radius:999px;border:none;cursor:pointer;font-size:1rem;
             font-weight:700;letter-spacing:.5px;transition:all .25s;
             background:#22c55e;color:#fff;box-shadow:0 0 18px #22c55e55;">
      <span id="led-icon" style="width:13px;height:13px;border-radius:50%;
            background:#fff;display:inline-block;box-shadow:0 0 8px #fff9;
            transition:background .3s,box-shadow .3s;"></span>
      <span id="btn-rastr-txt">Rastreamento ATIVO</span>
    </button>
  </div>
  <div id="rastr-feedback" style="text-align:center;font-size:.78rem;
       color:#64748b;min-height:18px;margin-bottom:4px;"></div>

  <div class="last-upd" id="last-upd">Aguardando leitura...</div>
</div>

<script>
const MAX = 4095;
let escuroAntes = false;   // último estado conhecido: contagem para deep sleep ativa
let falhasSeguidas = 0;

function ldrStyle(val) {
  const p = val / MAX;
  const cor = p > 0.5 ? '#fbbf24' : p > 0.25 ? '#fb923c' : '#6b7280';
  const glowAlpha = Math.round(p * 80).toString(16).padStart(2, '0');
  const glowSize  = Math.round(p * 28);
  const glowColor = p > 0.5 ? `#fbbf24${glowAlpha}` : p > 0.25 ? `#fb923c${glowAlpha}` : 'transparent';
  const border    = p > 0.5 ? '#fbbf24' : p > 0.25 ? '#fb923c44' : '#1d3557';
  return { cor, glow: `0 0 ${glowSize}px ${glowColor}`, border };
}

function bannerSleep(d) {
  const banner = document.getElementById('sleep-banner');
  const msg    = document.getElementById('sleep-msg');
  if (d.eco && d.sleepEm >= 0) {
    escuroAntes = true;
    banner.className = 'sleep-banner aviso';
    msg.textContent = `🌑 Sem luz nos LDRs — o sistema entra em deep sleep em ${d.sleepEm}s se a escuridão continuar. A interface web ficará indisponível durante o sono.`;
  } else {
    escuroAntes = false;
    banner.className = 'sleep-banner off';
  }
}

function bannerDormindo() {
  const banner = document.getElementById('sleep-banner');
  const msg    = document.getElementById('sleep-msg');
  banner.className = 'sleep-banner dormindo';
  msg.textContent = '😴 O ESP32 provavelmente entrou em deep sleep por falta de luz. Ele acorda sozinho pelo timer ou pelo botão BOOT, com todo o histórico preservado nos gráficos.';
}

// ── Botão toggle de rastreamento ─────────────────────────────────────────
let rastrRequisicao = false;  // evita cliques duplos durante a requisição

function atualizarBotaoRastr(ativo) {
  const btn  = document.getElementById('btn-rastr');
  const txt  = document.getElementById('btn-rastr-txt');
  const led  = document.getElementById('led-icon');
  if (ativo) {
    btn.style.background   = '#22c55e';
    btn.style.boxShadow    = '0 0 18px #22c55e55';
    txt.textContent        = 'Rastreamento ATIVO';
    led.style.background   = '#fff';
    led.style.boxShadow    = '0 0 8px #fff9';
  } else {
    btn.style.background   = '#475569';
    btn.style.boxShadow    = '0 2px 8px #0004';
    txt.textContent        = 'Rastreamento PAUSADO';
    led.style.background   = '#334155';
    led.style.boxShadow    = 'none';
  }
}

function toggleRastreamento() {
  if (rastrRequisicao) return;
  rastrRequisicao = true;
  const fb  = document.getElementById('rastr-feedback');
  const btn = document.getElementById('btn-rastr');
  const ativoAtual = btn.style.background.includes('22c55e');
  const novoEstado = !ativoAtual;

  fb.textContent  = novoEstado ? 'Ativando...' : 'Pausando...';
  fb.style.color  = '#94a3b8';

  fetch('/rastreamento', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ativo: novoEstado })
  })
  .then(r => r.json())
  .then(res => {
    atualizarBotaoRastr(res.ativo);
    fb.textContent = res.ativo ? '✅ Rastreamento ativado' : '⏹ Rastreamento pausado';
    fb.style.color = res.ativo ? '#22c55e' : '#94a3b8';
    setTimeout(() => { fb.textContent = ''; }, 2500);
  })
  .catch(() => {
    fb.textContent = '⚠️ Falha na comunicação';
    fb.style.color = '#f87171';
    setTimeout(() => { fb.textContent = ''; }, 3000);
  })
  .finally(() => { rastrRequisicao = false; });
}

function atualizar() {
  fetch('/dados').then(r => r.json()).then(d => {
    falhasSeguidas = 0;
    document.getElementById('temp').innerText = d.temperatura.toFixed(1);
    document.getElementById('umid').innerText = d.umidade.toFixed(1);
    document.getElementById('sv').innerText   = d.servoV + '°';
    document.getElementById('sh').innerText   = d.servoH + '°';
    document.getElementById('sv-bar').style.width = (d.servoV / 180 * 100) + '%';
    document.getElementById('sh-bar').style.width = (d.servoH / 360 * 100) + '%';
    document.getElementById('svg-ang').textContent = d.servoV + '°';

    // Badge de estado do servo horizontal
    const estadoMap = {
      'rastreando':    { txt: '🔍 Rastreando',      cor: '#22c55e' },
      'pausa_busca':   { txt: '⏸ Pausa de busca',  cor: '#f59e0b' },
      'retorno_home':  { txt: '🏠 Retornando home', cor: '#3b82f6' },
    };
    const shEl = document.getElementById('sh-estado');
    const paused = d.rastreamentoAtivo === false;
    if (paused) {
      shEl.textContent = '⏹ Pausado'; shEl.style.color = '#64748b';
    } else if (d.estadoServoH && estadoMap[d.estadoServoH]) {
      shEl.textContent = estadoMap[d.estadoServoH].txt;
      shEl.style.color = estadoMap[d.estadoServoH].cor;
    } else {
      shEl.textContent = '--'; shEl.style.color = '#94a3b8';
    }

    const ldrs = { tl: d.ldrTL, tr: d.ldrTR, bl: d.ldrBL, br: d.ldrBR };
    Object.entries(ldrs).forEach(([k, v]) => {
      const st = ldrStyle(v);
      const el = document.getElementById('v-' + k);
      const card = document.getElementById('card-' + k);
      el.innerText = v;
      el.style.color = st.cor;
      card.style.boxShadow   = st.glow;
      card.style.borderColor = st.border;
    });

    const avgLDR = (d.ldrTL + d.ldrTR + d.ldrBL + d.ldrBR) / 4 / MAX;
    document.getElementById('sunspot-el').style.opacity = avgLDR * 0.8;
    document.getElementById('painel-svg').style.filter =
      `drop-shadow(0 0 ${Math.round(avgLDR * 40) + 10}px #58a6ff${Math.round(avgLDR * 80 + 20).toString(16).padStart(2, '0')})`;

    bannerSleep(d);

    // Sincroniza visual do botão com o estado vindo do ESP32
    atualizarBotaoRastr(d.rastreamentoAtivo !== false);

    document.getElementById('dot').style.background = '#3fb950';
    document.getElementById('stxt').innerText = 'Conectado ao ESP32';
    document.getElementById('last-upd').innerText = 'Última atualização: ' + new Date().toLocaleTimeString('pt-BR');
  }).catch(() => {
    falhasSeguidas++;
    document.getElementById('dot').style.background = '#ff7b72';
    document.getElementById('stxt').innerText = 'Sem conexão — reconectando...';
    // Se a última leitura mostrava a contagem de deep sleep, a queda de
    // conexão muito provavelmente é o ESP dormindo, não falha de rede.
    if (escuroAntes && falhasSeguidas >= 2) bannerDormindo();
  });
}
atualizar();
setInterval(atualizar, 2000);
</script>
</body>
</html>
