<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rastreador Solar</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#060d1a;color:#e6edf3;min-height:100vh;padding-top:72px}
.navbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px;background:#060d1aee;backdrop-filter:blur(12px);border-bottom:1px solid #1d3557;box-shadow:0 2px 20px #00000066}
.nav-brand{font-size:.95rem;font-weight:700;color:#58a6ff;display:flex;align-items:center;gap:8px;letter-spacing:.02em}
.nav-brand span{background:linear-gradient(135deg,#58a6ff,#3fb950);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-links{display:flex;gap:4px}
.nav-item{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;text-decoration:none;color:#6b7280;font-size:.8rem;font-weight:500;transition:all .2s}
.nav-item:hover{background:#1d3557;color:#e6edf3}
.nav-ativo{background:#0d2a4a;color:#58a6ff;border:1px solid #1d4a7a}
@media(max-width:600px){.nav-label{display:none}.nav-item{padding:8px 10px}}
h1{font-size:1.3rem;font-weight:700;background:linear-gradient(135deg,#58a6ff,#3fb950);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.sub{color:#6b7280;font-size:.78rem;margin-bottom:20px}
.sec{background:#0d1f38;border:1px solid #1d3557;border-radius:14px;padding:20px;margin-bottom:16px}
.sec-title{font-size:.7rem;color:#6b7280;text-transform:uppercase;letter-spacing:.12em;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.metric{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1d3557}
.metric:last-child{border-bottom:none}
.metric-label{font-size:.78rem;color:#6b7280}
.metric-value{font-size:.82rem;font-weight:600;font-family:'Courier New',monospace}
.green{color:#3fb950}.yellow{color:#fbbf24}.red{color:#ff7b72}.blue{color:#58a6ff}.orange{color:#ffa657}
.max-w{max-width:960px;margin:0 auto;padding:24px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.grid-2{grid-template-columns:1fr}}


    .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
    .tbtn{background:#0d1f38;border:1px solid #1d3557;color:#93c5fd;padding:7px 16px;border-radius:8px;font-size:.78rem;cursor:pointer;transition:all .2s;font-family:inherit}
    .tbtn:hover{background:#1d3557}
    .tbtn.danger{color:#ff7b72;border-color:#3d1a1a}
    .tbtn.danger:hover{background:#2d0f0f}
    .filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .fbtn{padding:5px 14px;border-radius:16px;font-size:.74rem;cursor:pointer;border:1px solid transparent;font-family:inherit;transition:all .2s}
    .fbtn.all  {background:#1d3557;color:#93c5fd;border-color:#2a4a7a}
    .fbtn.info {background:#1a3a22;color:#3fb950;border-color:#1d4a2a}
    .fbtn.warn {background:#2d2a0a;color:#fbbf24;border-color:#3a360a}
    .fbtn.erro {background:#2d0f0f;color:#ff7b72;border-color:#4a1a1a}
    .fbtn:hover{opacity:.8}
    .fbtn.ativo{outline:2px solid #58a6ff;outline-offset:1px}
    /* Tabela de logs */
    .log-table{width:100%;border-collapse:collapse;font-size:.76rem}
    .log-table th{padding:8px 10px;color:#6b7280;font-weight:500;border-bottom:1px solid #1d3557;font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;text-align:left;position:sticky;top:56px;background:#060d1a;z-index:10}
    .log-table td{padding:7px 10px;border-bottom:1px solid #0d1117;vertical-align:top}
    .log-table tr:hover td{background:#1d3557}
    .nivel-badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:.66rem;font-weight:700;letter-spacing:.05em}
    .INFO {background:#1a3a22;color:#3fb950}
    .WARN {background:#2d2a0a;color:#fbbf24}
    .ERRO {background:#2d0f0f;color:#ff7b72}
    .fn-col{color:#58a6ff;font-family:'Courier New',monospace;font-size:.72rem}
    .msg-col{color:#d1d5db}
    .time-col{color:#6b7280;font-family:'Courier New',monospace;font-size:.7rem;white-space:nowrap}
    .stats-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
    .stat-chip{background:#0d1f38;border:1px solid #1d3557;border-radius:20px;padding:5px 14px;font-size:.72rem;color:#6b7280}
    .stat-chip b{color:#e6edf3}
    #empty-msg{text-align:center;padding:40px;color:#6b7280;display:none}
  
</style></head><body>
<nav class="navbar">
  <div class="nav-brand">☀️ <span>Solar ESP32</span></div>
  <div class="nav-links">
    <a href="/" class="nav-item"><span>🏠</span><span class="nav-label">Dashboard</span></a>
    <a href="/graficos" class="nav-item"><span>📈</span><span class="nav-label">Gráficos</span></a>
    <a href="/performance" class="nav-item "><span>⚡</span><span class="nav-label">Performance</span></a>
    <a href="/logs" class="nav-item nav-ativo"><span>📋</span><span class="nav-label">Logs</span></a>
    <a href="/config" class="nav-item "><span>⚙️</span><span class="nav-label">Configurações</span></a>
    <a href="/changelog" class="nav-item "><span>📜</span><span class="nav-label">Changelog</span></a>
    <a href="/sobre" class="nav-item "><span>ℹ️</span><span class="nav-label">Sobre</span></a>
  </div>
</nav>

  <div class='max-w'>
    <h1>📋 Sistema de Logs</h1>
    <p class='sub'>Registros de erro, aviso e informação do sistema em tempo real</p>

    <div class='toolbar'>
      <button class='tbtn' onclick='carregar()'>↻ Atualizar</button>
      <button class='tbtn' onclick='exportarTXT()'>⬇ Exportar .txt</button>
      <button class='tbtn' onclick='exportarCSV()'>⬇ Exportar .csv</button>
      <button class='tbtn danger' onclick='limpar()'>🗑 Limpar logs</button>
      <label style='font-size:.74rem;color:#6b7280;display:flex;align-items:center;gap:6px'>
        <input type='checkbox' id='auto-refresh' checked onchange='toggleAuto()'>
        Auto-atualizar (5s)
      </label>
    </div>

    <div class='stats-bar' id='stats-bar'>
      <div class='stat-chip'>Carregando...</div>
    </div>

    <div class='filter-bar'>
      <span style='font-size:.74rem;color:#6b7280;align-self:center'>Filtrar:</span>
      <button class='fbtn all ativo' onclick='filtrar("ALL",this)'>Todos</button>
      <button class='fbtn info' onclick='filtrar("INFO",this)'>INFO</button>
      <button class='fbtn warn' onclick='filtrar("WARN",this)'>WARN</button>
      <button class='fbtn erro' onclick='filtrar("ERRO",this)'>ERRO</button>
    </div>

    <div class='sec' style='padding:0;overflow:hidden'>
      <table class='log-table' id='log-table'>
        <thead><tr>
          <th style='width:90px'>Tempo</th>
          <th style='width:60px'>Nível</th>
          <th style='width:130px'>Função</th>
          <th>Mensagem</th>
        </tr></thead>
        <tbody id='log-body'>
          <tr><td colspan='4' style='text-align:center;color:#6b7280;padding:24px'>Carregando...</td></tr>
        </tbody>
      </table>
      <div id='empty-msg'>Nenhum log encontrado com este filtro.</div>
    </div>
  </div>

  <script>
    let todosLogs = [];
    let filtroAtivo = 'ALL';
    let autoTimer;

    function fmtTempo(ms) {
      const s = Math.floor(ms/1000);
      const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sc = s%60;
      return (h?String(h).padStart(2,'0')+':':'') +
             String(m).padStart(2,'0')+':'+String(sc).padStart(2,'0')+
             '.'+String(ms%1000).padStart(3,'0');
    }

    function renderizar(logs) {
      const filtered = filtroAtivo === 'ALL' ? logs : logs.filter(l=>l.nivel===filtroAtivo);
      const tbody = document.getElementById('log-body');
      const empty = document.getElementById('empty-msg');

      if (filtered.length === 0) {
        tbody.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      // Exibe do mais recente para o mais antigo
      tbody.innerHTML = [...filtered].reverse().map(l => `
        <tr>
          <td class='time-col'>${fmtTempo(l.t)}</td>
          <td><span class='nivel-badge ${l.nivel}'>${l.nivel}</span></td>
          <td class='fn-col'>${l.funcao}</td>
          <td class='msg-col'>${l.msg}</td>
        </tr>`).join('');
    }

    function carregar() {
      fetch('/logsdata').then(r=>r.json()).then(d=>{
        todosLogs = d.logs;
        const total = d.total;
        const erros = d.logs.filter(l=>l.nivel==='ERRO').length;
        const warns = d.logs.filter(l=>l.nivel==='WARN').length;
        const infos = d.logs.filter(l=>l.nivel==='INFO').length;
        document.getElementById('stats-bar').innerHTML =
          `<div class='stat-chip'>Total: <b>${total}</b></div>` +
          `<div class='stat-chip' style='color:#3fb950'>INFO: <b>${infos}</b></div>` +
          `<div class='stat-chip' style='color:#fbbf24'>WARN: <b>${warns}</b></div>` +
          `<div class='stat-chip' style='color:#ff7b72'>ERRO: <b>${erros}</b></div>`;
        renderizar(todosLogs);
      }).catch(()=>{
        document.getElementById('log-body').innerHTML =
          "<tr><td colspan='4' style='text-align:center;color:#ff7b72;padding:20px'>Erro ao carregar logs</td></tr>";
      });
    }

    function filtrar(nivel, btn) {
      filtroAtivo = nivel;
      document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('ativo'));
      btn.classList.add('ativo');
      renderizar(todosLogs);
    }

    function limpar() {
      if (!confirm('Tem certeza que deseja limpar todos os logs?')) return;
      fetch('/logsclear').then(()=>{ todosLogs=[]; renderizar([]); carregar(); });
    }

    function exportarTXT() {
      const filtered = filtroAtivo==='ALL' ? todosLogs : todosLogs.filter(l=>l.nivel===filtroAtivo);
      let txt = '=== LOGS RASTREADOR SOLAR ESP32 ===\n';
      txt += 'Exportado em: ' + new Date().toLocaleString('pt-BR') + '\n';
      txt += 'Filtro: ' + filtroAtivo + '\n';
      txt += '='.repeat(60) + '\n\n';
      [...filtered].reverse().forEach(l=>{
        txt += `[${fmtTempo(l.t)}] [${l.nivel}] [${l.funcao}] ${l.msg}\n`;
      });
      baixar(txt, 'logs_rastreador_solar.txt', 'text/plain');
    }

    function exportarCSV() {
      const filtered = filtroAtivo==='ALL' ? todosLogs : todosLogs.filter(l=>l.nivel===filtroAtivo);
      let csv = 'Tempo(ms),Tempo_fmt,Nivel,Funcao,Mensagem\n';
      [...filtered].reverse().forEach(l=>{
        csv += `${l.t},"${fmtTempo(l.t)}","${l.nivel}","${l.funcao}","${l.msg}"\n`;
      });
      baixar(csv, 'logs_rastreador_solar.csv', 'text/csv');
    }

    function baixar(conteudo, nome, tipo) {
      const blob = new Blob([conteudo], {type: tipo});
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url; a.download = nome; a.click();
      URL.revokeObjectURL(url);
    }

    function toggleAuto() {
      clearInterval(autoTimer);
      if (document.getElementById('auto-refresh').checked) {
        autoTimer = setInterval(carregar, 5000);
      }
    }

    carregar();
    autoTimer = setInterval(carregar, 5000);
  </script>
</body></html>
</body></html>
